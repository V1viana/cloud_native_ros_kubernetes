# Base RBAC for the Fleet Operator. Split cluster-scoped vs. namespaced
# deliberately: the removed CRD spike (see ../README.md) found that Kopf
# needs a small cluster-scoped grant to discover CRDs and namespaces even
# when every managed workload stays inside one namespace -- do not widen
# this ClusterRole beyond discovery without a documented reason (K4 in
# docs/GAP_ANALYSIS.md: "RBAC minimo senza cluster-admin").
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fleet-operator
  namespace: dronekube-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fleet-operator-discovery
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kopf.dev"]
    resources: ["clusterkopfpeerings"]
    verbs: ["list", "watch", "patch", "get"]
  # R7: node labels, read-only -- RobotFleet.status.edgeNodes (nodes matching
  # edgeNodeSelector) and ROSModule.status.observedPlacement (where Pods run).
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fleet-operator-discovery
subjects:
  - kind: ServiceAccount
    name: fleet-operator
    namespace: dronekube-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fleet-operator-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-operator
  namespace: dronekube-operator
rules:
  - apiGroups: ["dronekube.io"]
    resources:
      - robotfleets
      - rosmodules
      - roslifecyclepolicies
      - adaptationpolicies
    verbs: ["get", "list", "watch", "patch", "update"]
  # rosmodules alone also needs create: adaptation_controller.py's
  # _create_edge_module() is the only place anything in this Role creates a
  # top-level dronekube.io object itself (the blue/green migration's edge
  # instance) rather than only reading/patching one a human or GitOps
  # already applied. Found live: masked for most of today's testing because
  # the operator ran locally with admin kubeconfig credentials; only
  # surfaced once the containerized operator, with this real Role, tried to
  # run the same migration for real. delete is the same story one level
  # further: _delete_module() (rollback, when the edge instance never
  # reaches Active in time) also never ran through this real Role until
  # E4 -- the earlier rollback test today (bugs #8/#9) happened before the
  # operator was containerized at all, so it too was really running as
  # local admin, not this ServiceAccount.
  - apiGroups: ["dronekube.io"]
    resources: [rosmodules]
    verbs: ["create", "delete"]
  - apiGroups: ["dronekube.io"]
    resources:
      - robotfleets/status
      - rosmodules/status
      - roslifecyclepolicies/status
      - adaptationpolicies/status
    verbs: ["patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # R1, decision 4: the optional ClusterIP Service a ROSModule may declare.
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Lifecycle convergence checks the Deployment -> ReplicaSet -> Pod ownership
  # chain instead of trusting only the instances that happen to report status.
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  # HPA for the edge instance (proposal S4.1: "l'HPA ne possiede lo
  # scaling") -- adaptation_controller.py's _create_edge_hpa(). Missing
  # this caused a live 403 the first time an edge migration actually tried
  # to create one (found the same day probes/resources were added, which
  # is what finally made a CPU-utilization HPA target meaningful here).
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # RestartComponent (P1-equivalent, adaptation_controller.py's
  # _restart_component()) triggers a real rollout via the Deployment's own
  # pod-template annotations (the same mechanism `kubectl rollout restart`
  # uses) -- already covered by the "apps"/deployments patch verb above,
  # no separate pods grant needed. (An earlier version deleted the Pod(s)
  # directly; found live that raced the old Pod's termination against the
  # new one on the Agent's fixed hostNetwork port, so this controller no
  # longer touches pods at all for this action.)
  # _create_diagnostic_job(): create only, on purpose -- the operator never
  # reads a Job back or deletes one itself (Kubernetes' own garbage
  # collector reclaims it via the ownerReference once the AdaptationPolicy
  # that created it is deleted).
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create"]
  # R8: per-Pod CPU/memory from metrics-server, read-only, as decision
  # context of the AdaptationController (never a trigger, never replicas).
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-operator
  namespace: dronekube-operator
subjects:
  - kind: ServiceAccount
    name: fleet-operator
    namespace: dronekube-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-operator
---
# Least-privilege ServiceAccount for the diagnostic Job itself
# (diagnostic_job.py): read-only, never the fleet-operator's own broader
# ServiceAccount -- it only ever lists Pods and Events, same narrowing
# discipline as state-bridge's own separate ServiceAccount.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-diagnostics
  namespace: dronekube-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: telemetry-diagnostics
  namespace: dronekube-operator
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: telemetry-diagnostics
  namespace: dronekube-operator
subjects:
  - kind: ServiceAccount
    name: telemetry-diagnostics
    namespace: dronekube-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: telemetry-diagnostics
