event_detector:
  ros__parameters:
    startup_state: 3
    analysis:
      default_period: 0.2
    rules:
      - px4_event_detector_plugin::BatteryLowRule
      - px4_event_detector_plugin::TelemetryHeartbeatRule
      - px4_event_detector_plugin::AnalyticsLatencySloRule
    rule_params:
      px4_event_detector_plugin::BatteryLowRule:
        enabled: true
        period: 0.1
        parameters:
          robot_id: drone01
          battery_topic: /fmu/out/battery_status_v1
          command_topic: /fmu/in/vehicle_command
          ack_topic: /fmu/out/vehicle_command_ack
          vehicle_status_topic: /fmu/out/vehicle_status_v4
          event_topic: /fleet/operational_events
          threshold: 0.20
          reset_threshold: 0.25
          consecutive_samples: 3
          max_message_age_sec: 2.0
          max_attempts: 3
          retry_timeout_sec: 2.0
          target_system: 1
          target_component: 1
          source_system: 1
          source_component: 1
      px4_event_detector_plugin::TelemetryHeartbeatRule:
        enabled: true
        period: 0.2
        parameters:
          robot_id: drone01
          vehicle_status_topic: /fmu/out/vehicle_status_v4
          event_topic: /fleet/operational_events
          startup_grace_sec: 60.0
          timeout_sec: 5.0
          recovery_samples: 3
          recovery_window_sec: 3.0
          recovery_stability_sec: 3.0
          cooldown_sec: 60.0
      px4_event_detector_plugin::AnalyticsLatencySloRule:
        enabled: true
        period: 0.5
        parameters:
          robot_id: drone01
          metrics_topic: /drone01/analytics/metrics
          event_topic: /fleet/operational_events
          violation_threshold_ms: 250.0
          recovery_threshold_ms: 150.0
          window_sec: 10.0
          consecutive_windows: 3
