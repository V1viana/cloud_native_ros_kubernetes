apiVersion: v1
kind: ApplicationDeployment

metadata:
  name: registry-smoke-drone01
  rosVersion: humble
  rmwImplementation: fastdds
  appVersion: registry-smoke-v1
  targetFleet: uav-sim-fleet
  targetRobots: [drone01]
  discoveryServer:
    create: false
    serviceName: p2-fastdds-discovery
    address: __P2_DISCOVERY_ADDRESS__
    port: 11811

containerRegistry:
  - name: default
    imagePullSecretName: kuberos-test-repo
    imagePullPolicy: Always

rosModules:
  - name: registry-smoke
    workloadKind: Deployment
    replicas: 1
    image: __PRIVATE_IMAGE_DIGEST__
    imagePullPolicy: Always
    sourceWs: /ws/install/
    entrypoint:
      - |-
        exec ros2 run companion_analytics companion_analytics --ros-args \
          -r __node:=registry_smoke \
          -r __ns:=/drone01 \
          -p robot_id:=drone01 \
          -p instance_id:=registry-smoke \
          -p metrics_topic:=/drone01/registry_smoke/metrics \
          -p health_service:=/drone01/registry_smoke/health \
          -p processing_delay_ms:=20.0 \
          -p queue_depth:=2 \
          -p cpu_percent:=5.0 \
          -p sample_period_ms:=500
    preference: [onboard]
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 192Mi
    startupProbe:
      exec:
        command: ["/bin/bash", "-c", "kill -0 1"]
      periodSeconds: 2
      failureThreshold: 30
    readinessProbe:
      exec:
        command: ["/bin/bash", "-c", "kill -0 1"]
      periodSeconds: 3
    livenessProbe:
      exec:
        command: ["/bin/bash", "-c", "kill -0 1"]
      periodSeconds: 10
    requirements:
      dynamicRescheduling: false
      privileged: false
