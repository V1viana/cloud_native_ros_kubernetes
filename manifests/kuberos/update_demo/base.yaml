apiVersion: v1
kind: ApplicationDeployment

metadata:
  name: px4-update-demo-drone01
  rosVersion: humble
  rmwImplementation: fastdds
  appVersion: update-demo-base
  targetFleet: uav-sim-fleet
  targetRobots: [drone01]
  edgeResourceGroup: [public]

rosModules:
  - name: microxrce-agent
    workloadKind: Deployment
    replicas: 1
    image: microros/micro-ros-agent:humble
    imagePullPolicy: IfNotPresent
    rosParameters:
      - name: microxrce-agent-discovery
        type: yaml
        mountPath: /tmp/kuberos-fastdds/microxrce-agent
        valueFrom: microxrce-agent-discovery-drone01.xml
    entrypoint:
      - |-
        export RMW_IMPLEMENTATION=rmw_fastrtps_cpp
        export ROS_DISCOVERY_SERVER=drone01-primary-discovery-server:11811
        export FASTRTPS_DEFAULT_PROFILES_FILE=/tmp/kuberos-fastdds/microxrce-agent/microxrce-agent-discovery-drone01.xml
        export FASTDDS_DEFAULT_PROFILES_FILE=/tmp/kuberos-fastdds/microxrce-agent/microxrce-agent-discovery-drone01.xml
        exec /uros_ws/install/micro_ros_agent/lib/micro_ros_agent/micro_ros_agent udp4 --port 8888
    preference: [onboard]
    requirements:
      latency: 50ms
      dynamicRescheduling: false
      privileged: false

  - name: px4-sitl
    image: px4io/px4-sitl:latest
    imagePullPolicy: IfNotPresent
    entrypoint:
      - |-
        cd /opt/px4
        export PATH=/opt/px4/bin:$PATH
        export PX4_SIM_MODEL=sihsim_quadx
        AG_IP="$DRONE01_XRCE_AGENT_SERVICE_HOST"
        if [ -z "$AG_IP" ]; then
          echo "[px4-sitl] XRCE Agent Service is unavailable"
          exit 1
        fi
        AG_IP_INT=$(awk -F. -v ip="$AG_IP" 'BEGIN {
          split(ip,a,".");
          printf "%u", a[1]*16777216 + a[2]*65536 + a[3]*256 + a[4]
        }')
        export PX4_PARAM_UXRCE_DDS_AG_IP="$AG_IP_INT"
        export PX4_PARAM_UXRCE_DDS_PRT=8888
        sed -i "s/param set-default UXRCE_DDS_AG_IP .*/param set-default UXRCE_DDS_AG_IP $AG_IP_INT # $AG_IP/" /opt/px4/etc/init.d-posix/rcS || true
        exec px4 -s /opt/px4/etc/init.d-posix/rcS /opt/px4
    preference: [onboard]
    requirements:
      latency: 50ms
      dynamicRescheduling: false
      privileged: true
    env:
      - name: PX4_SIM_MODEL
        value: sihsim_quadx

  - name: event-detector
    workloadKind: Deployment
    replicas: 1
    image: cloud-native-ros/event-detector:p2
    imagePullPolicy: IfNotPresent
    sourceWs: /ws/install/
    rosParameters:
      - name: runtime
        type: key-value
        valueFrom: runtime-drone01
      - name: detector-config
        type: yaml
        mountPath: /etc/event-detector
        valueFrom: event-detector-drone01.yaml
    entrypoint:
      - |-
        exec ros2 launch event_detector event_detector.launch.py name:=event_detector namespace:=/drone01 params:=/etc/event-detector/event-detector-drone01.yaml log_level:=info
    preference: [onboard]
    requirements:
      latency: 100ms
      dynamicRescheduling: false
      privileged: false

  - name: companion-analytics
    workloadKind: Deployment
    replicas: 1
    image: cloud-native-ros/companion-analytics:dev
    imagePullPolicy: IfNotPresent
    sourceWs: /workspace/install
    rosParameters:
      - name: companion-analytics-config
        type: key-value
        valueFrom: companion-analytics-config-drone01
    entrypoint:
      - |-
        exec ros2 run companion_analytics companion_analytics
    preference: [onboard]
    requirements:
      latency: 150ms
      dynamicRescheduling: true
      privileged: false

rosParamMap:
  - name: runtime-drone01
    type: key-value
    data:
      ROS_DOMAIN_ID: "230"
      RMW_IMPLEMENTATION: rmw_fastrtps_cpp
      ROS_DISCOVERY_SERVER: drone01-primary-discovery-server:11811

  - name: event-detector-drone01.yaml
    type: yaml
    data: |
      /drone01/event_detector:
        ros__parameters:
          startup_state: 3
          buffer:
            default_time: 10.0
            default_queue_size: 50
            use_msg_stamp: true
          analysis:
            default_period: 0.2
          rules:
            - px4_event_detector_plugin::AnalyticsLatencySloRule
          rule_params:
            px4_event_detector_plugin::AnalyticsLatencySloRule:
              enabled: true
              period: 0.2
              parameters:
                robot_id: drone01
                metrics_topic: /drone01/analytics/metrics
                event_topic: /fleet/operational_events
                violation_threshold_ms: 250.0
                recovery_threshold_ms: 150.0
                window_sec: 2.0
                consecutive_windows: 3

  - name: companion-analytics-config-drone01
    type: key-value
    data:
      robot_id: drone01
      processing_mode: onboard
      processing_delay_ms: "220"
      latency_slo_ms: "150"
      sample_period_ms: "500"

  - name: microxrce-agent-discovery-drone01.xml
    type: yaml
    path: __PROJECT_ROOT__/manifests/kuberos/update_demo/config/microxrce-agent-discovery-drone01.xml
