apiVersion: v1
kind: Namespace
metadata:
  name: cloud-native-p2
  labels:
    cloud-native-robotics.io/experiment: p2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuberos
  namespace: cloud-native-p2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloud-native-p2-kuberos-inventory
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloud-native-p2-kuberos-inventory
subjects:
  - kind: ServiceAccount
    name: kuberos
    namespace: cloud-native-p2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud-native-p2-kuberos-inventory
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuberos-runtime
  namespace: cloud-native-p2
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuberos-runtime
  namespace: cloud-native-p2
subjects:
  - kind: ServiceAccount
    name: kuberos
    namespace: cloud-native-p2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuberos-runtime
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-native-application-manager
  namespace: cloud-native-p2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-native-application-manager
  namespace: cloud-native-p2
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-native-application-manager
  namespace: cloud-native-p2
subjects:
  - kind: ServiceAccount
    name: cloud-native-application-manager
    namespace: cloud-native-p2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-native-application-manager
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: p2-audit-writer
  namespace: cloud-native-p2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: p2-operator-notifier
  namespace: cloud-native-p2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: p2-platform-observer
  namespace: cloud-native-p2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: p2-platform-observer
  namespace: cloud-native-p2
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: p2-platform-observer
  namespace: cloud-native-p2
subjects:
  - kind: ServiceAccount
    name: p2-platform-observer
    namespace: cloud-native-p2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: p2-platform-observer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: analytics-routing-drone01
  namespace: cloud-native-p2
data:
  active_instance: onboard
  correlation_id: ""
