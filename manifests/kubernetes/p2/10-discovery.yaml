apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2-fastdds-discovery
  namespace: cloud-native-p2
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: p2-fastdds-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p2-fastdds-discovery
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kuberos.io/role: control_plane
      containers:
        - name: discovery
          image: cloud-native-ros/control-plane:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              source /opt/ros/humble/setup.bash
              exec fastdds discovery -i 0 -l "$DISCOVERY_SERVER_ADDRESS" -p 11811
          env:
            - name: DISCOVERY_SERVER_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: discovery
              containerPort: 11811
              protocol: UDP
          # Had no resources at all until found live at S3 N=20: this
          # process shares its node with the whole control-plane stack
          # (KubeROS API/Celery, audit-writer, dispatcher, ...), which
          # gets busier as bootstrap progresses, and with zero CPU request
          # it had no scheduling priority at all -- observed live using
          # ~795m of a single core while its own log flooded with ~8400
          # "DISCOVERY_DATABASE Error: Matching unexisting participant"
          # entries over one run's ~66 minutes. Request set to what it was
          # already observed trying to use, not a guess; limit left with
          # headroom in case the bottleneck is partly about being starved
          # rather than a hard single-core ceiling -- not yet proven
          # either way, this is the additive, low-risk experiment to run
          # before concluding it's the latter.
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: p2-fastdds-discovery
  namespace: cloud-native-p2
spec:
  clusterIP: 10.43.230.10
  selector:
    app.kubernetes.io/name: p2-fastdds-discovery
  ports:
    - name: discovery
      port: 11811
      targetPort: 11811
      protocol: UDP
