apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2-fastdds-discovery
  namespace: cloud-native-p2
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: p2-fastdds-discovery
  template:
    metadata:
      labels:
        app.kubernetes.io/name: p2-fastdds-discovery
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kuberos.io/role: control_plane
      containers:
        - name: discovery
          image: cloud-native-ros/control-plane:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              source /opt/ros/humble/setup.bash
              exec fastdds discovery -i 0 -l "$DISCOVERY_SERVER_ADDRESS" -p 11811
          env:
            - name: DISCOVERY_SERVER_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          ports:
            - name: discovery
              containerPort: 11811
              protocol: UDP
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: p2-fastdds-discovery
  namespace: cloud-native-p2
spec:
  clusterIP: 10.43.230.10
  selector:
    app.kubernetes.io/name: p2-fastdds-discovery
  ports:
    - name: discovery
      port: 11811
      targetPort: 11811
      protocol: UDP
