apiVersion: v1
kind: Service
metadata:
  name: kuberos-api
  namespace: cloud-native-p2
spec:
  selector:
    app.kubernetes.io/name: kuberos
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuberos
  namespace: cloud-native-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kuberos
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuberos
    spec:
      serviceAccountName: kuberos
      nodeSelector:
        kuberos.io/role: control_plane
      initContainers:
        - name: initialize
          image: cloud-native-ros/kuberos:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - |
              python manage.py migrate --noinput
              python manage.py bootstrap_p2
          env: &kuberos-env
            - name: DJANGO_SETTINGS_MODULE
              value: settings.base
            - name: DJANGO_ALLOWED_HOSTS
              value: "*"
            - name: DJANGO_SECRET_KEY
              value: p2-isolated-runtime-key
            - name: CELERY_BROKER_URL
              value: redis://localhost:6379/0
            - name: KUBEROS_SQLITE_PATH
              value: /state/db.sqlite3
            # Additive, opt-in per settings/base.py: default sqlite3
            # busy-timeout (5s) is too short once N robots generate
            # overlapping deploy_rosmodule requests against the API
            # server's shared SQLite file -- found live at S3 N=20
            # ("database is locked", unrelated to CPU/RAM). Harmless at
            # the low concurrency every other scenario runs at.
            - name: KUBEROS_SQLITE_TIMEOUT
              value: "20"
            - name: KUBEROS_MEDIA_ROOT
              value: /state/media
            - name: KUBEROS_TARGET_NAMESPACE
              value: cloud-native-p2
            - name: KUBEROS_CLUSTER_NAME
              value: cloud-native-p2
            - name: KUBEROS_FLEET_NAME
              value: uav-sim-fleet
            - name: KUBEROS_ROBOT_ID
              value: drone01
            - name: KUBEROS_ONBOARD_NODE
              value: k3d-cloud-native-p2-agent-0
            - name: KUBEROS_EDGE_NODE
              value: k3d-cloud-native-p2-agent-1
            - name: KUBEROS_CONTROL_NODE
              value: k3d-cloud-native-p2-server-0
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: redis
          image: redis:7
          imagePullPolicy: IfNotPresent
          readinessProbe:
            tcpSocket:
              port: 6379
            periodSeconds: 2
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
        - name: api
          image: cloud-native-ros/kuberos:p2
          imagePullPolicy: IfNotPresent
          env: *kuberos-env
          ports:
            - containerPort: 8000
              name: http
          readinessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 3
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 8000
            periodSeconds: 10
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
        - name: worker
          image: cloud-native-ros/kuberos:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - exec celery -A settings.celery worker --loglevel=INFO --concurrency=1
          env: *kuberos-env
          volumeMounts:
            - name: state
              mountPath: /state
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
      volumes:
        - name: state
          emptyDir: {}
