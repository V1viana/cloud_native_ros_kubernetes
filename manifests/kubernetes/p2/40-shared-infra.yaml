# PX4 SITL and the Micro XRCE-DDS Agent, extracted verbatim from
# 40-workload.yaml (variant A) into their own file so variant B can reuse
# them without also pulling in variant A's Event Detector and self-
# activating companion_analytics container -- applying 40-workload.yaml
# wholesale for variant B would run two independent reaction mechanisms
# against the same metric at once, which is not a clean A/B comparison.
# Keep these two Deployments identical to their 40-workload.yaml copies by
# hand; nothing enforces that automatically.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone01-microxrce-agent
  namespace: cloud-native-p2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drone01-microxrce-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drone01-microxrce-agent
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kuberos.io/role: onboard
      containers:
        - name: agent
          image: microros/micro-ros-agent:humble
          imagePullPolicy: IfNotPresent
          args: ["udp4", "--port", "8888"]
          env:
            - name: ROS_DOMAIN_ID
              value: "230"
            - name: RMW_IMPLEMENTATION
              value: rmw_fastrtps_cpp
            - name: ROS_DISCOVERY_SERVER
              value: __P2_DISCOVERY_ADDRESS__:11811
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone01-px4-sitl
  namespace: cloud-native-p2
  labels:
    cloud-native-robotics.io/criticality: flight-control
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drone01-px4-sitl
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drone01-px4-sitl
        cloud-native-robotics.io/criticality: flight-control
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        kuberos.io/role: onboard
      containers:
        - name: px4
          image: px4io/px4-sitl:latest
          imagePullPolicy: IfNotPresent
          workingDir: /opt/px4
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              sed -i \
                "s|uxrce_dds_client start -t udp|uxrce_dds_client start -t udp -h 127.0.0.1|" \
                /opt/px4/etc/init.d-posix/rcS
              exec /opt/px4/bin/px4 -d \
                -s /opt/px4/etc/init.d-posix/rcS /opt/px4
          env:
            - name: PX4_SIM_MODEL
              value: sihsim_quadx
            - name: ROS_DOMAIN_ID
              value: "230"
          resources:
            requests:
              cpu: 250m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            periodSeconds: 5
