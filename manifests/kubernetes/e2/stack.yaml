apiVersion: v1
kind: Namespace
metadata:
  name: cloud-native-e2
  labels:
    cloud-native-robotics.io/experiment: e2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2-fastdds-udp
  namespace: cloud-native-e2
data:
  fastdds.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <profiles xmlns="http://www.eprosima.com/XMLSchemas/fastRTPS_Profiles">
      <transport_descriptors>
        <transport_descriptor>
          <transport_id>udp_transport</transport_id>
          <type>UDPv4</type>
        </transport_descriptor>
      </transport_descriptors>
      <participant profile_name="udp_only" is_default_profile="true">
        <rtps>
          <userTransports>
            <transport_id>udp_transport</transport_id>
          </userTransports>
          <useBuiltinTransports>false</useBuiltinTransports>
        </rtps>
      </participant>
    </profiles>
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloud-native-application-manager
  namespace: cloud-native-e2
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloud-native-application-manager
  namespace: cloud-native-e2
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  resourceNames: ["drone01-microxrce-agent"]
  verbs: ["patch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch"]
- apiGroups: ["events.k8s.io"]
  resources: ["events"]
  verbs: ["create", "get", "list", "patch", "update"]
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloud-native-application-manager
  namespace: cloud-native-e2
subjects:
- kind: ServiceAccount
  name: cloud-native-application-manager
  namespace: cloud-native-e2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloud-native-application-manager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2-diagnostic-job-template
  namespace: cloud-native-e2
data:
  job.yaml: |
    apiVersion: batch/v1
    kind: Job
    metadata:
      generateName: telemetry-diag-
      labels:
        app.kubernetes.io/name: telemetry-diagnostics
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 310
      ttlSecondsAfterFinished: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: telemetry-diagnostics
        spec:
          serviceAccountName: cloud-native-application-manager
          restartPolicy: Never
          containers:
          - name: collector
            image: ros:humble-ros-base
            imagePullPolicy: IfNotPresent
            command: ["/bin/bash", "-ec"]
            args:
            - |
              python3 - <<'PY'
              import json
              import os
              import ssl
              import time
              from urllib.request import Request, urlopen

              ns = os.environ["POD_NAMESPACE"]
              host = os.environ["KUBERNETES_SERVICE_HOST"]
              port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
              account = "/var/run/secrets/kubernetes.io/serviceaccount"
              token = open(f"{account}/token", encoding="utf-8").read().strip()
              context = ssl.create_default_context(cafile=f"{account}/ca.crt")
              base = f"https://{host}:{port}"

              def get(path):
                  request = Request(
                      base + path,
                      headers={"Authorization": f"Bearer {token}"},
                  )
                  with urlopen(request, context=context, timeout=5) as response:
                      return json.load(response)

              end = time.monotonic() + 300
              while time.monotonic() < end:
                  pods = get(f"/api/v1/namespaces/{ns}/pods")
                  events = get(f"/apis/events.k8s.io/v1/namespaces/{ns}/events")
                  print(json.dumps({
                      "timestamp": time.time(),
                      "robot_id": os.environ.get("ROBOT_ID", ""),
                      "correlation_id": os.environ.get(
                          "INCIDENT_CORRELATION_ID", ""
                      ),
                      "pods": [
                          {
                              "name": item["metadata"]["name"],
                              "phase": item.get("status", {}).get("phase", ""),
                          }
                          for item in pods.get("items", [])
                      ],
                      "events": [
                          {
                              "reason": item.get("reason", ""),
                              "action": item.get("action", ""),
                          }
                          for item in events.get("items", [])[-50:]
                      ],
                  }, sort_keys=True), flush=True)
                  time.sleep(10)
              PY
            env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-manager-e2
  namespace: cloud-native-e2
  labels:
    app.kubernetes.io/name: application-manager-e2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: application-manager-e2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-manager-e2
    spec:
      serviceAccountName: cloud-native-application-manager
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: application-manager
        image: cloud-native-ros/control-plane:e2
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          source /ws/install/setup.bash
          exec ros2 run cloud_native_application_manager application_manager \
            --ros-args \
            -p event_topic:=/fleet/operational_events \
            -p kubernetes_namespace:=cloud-native-e2 \
            -p diagnostic_job_template_path:=/etc/cloud-native/job.yaml \
            -p default_timeout_sec:=45.0 \
            -p poll_interval_sec:=0.5 \
            -p audit_url:=http://p2-audit-writer:8080/records \
            -p notifier_url:=http://p2-operator-notifier:8081/notifications \
            -p report_spool_path:=/var/lib/cloud-native-manager/outbox.sqlite3
        # R9, decision D4b (Viviana, 2026-09-26): E2 reuses the project's
        # Audit Writer and Operator Notifier (rendered from
        # manifests/kubernetes/p2/25-observability.yaml by
        # scripts/render_observability.py), with the same outbox as P2's
        # Application Manager, so its incident records are delivered after
        # the fact if the writer is briefly down (A's contract, EV23).
        env:
        - name: ROS_DOMAIN_ID
          value: "229"
        - name: RMW_IMPLEMENTATION
          value: rmw_fastrtps_cpp
        - name: FASTRTPS_DEFAULT_PROFILES_FILE
          value: /etc/fastdds/fastdds.xml
        - name: FASTDDS_DEFAULT_PROFILES_FILE
          value: /etc/fastdds/fastdds.xml
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 500m
            memory: 384Mi
        startupProbe:
          exec:
            command: ["/bin/bash", "-c", "kill -0 1"]
          periodSeconds: 2
          failureThreshold: 15
        readinessProbe:
          exec:
            command: ["/bin/bash", "-c", "kill -0 1"]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["/bin/bash", "-c", "kill -0 1"]
          periodSeconds: 10
        volumeMounts:
        - name: diagnostics
          mountPath: /etc/cloud-native
          readOnly: true
        - name: fastdds
          mountPath: /etc/fastdds
          readOnly: true
        - name: manager-outbox
          mountPath: /var/lib/cloud-native-manager
      volumes:
      - name: diagnostics
        configMap:
          name: e2-diagnostic-job-template
      - name: fastdds
        configMap:
          name: e2-fastdds-udp
      - name: manager-outbox
        persistentVolumeClaim:
          claimName: p2-manager-outbox
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operational-event-dispatcher-e2
  namespace: cloud-native-e2
  labels:
    app.kubernetes.io/name: operational-event-dispatcher-e2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operational-event-dispatcher-e2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operational-event-dispatcher-e2
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: dispatcher
        image: cloud-native-ros/control-plane:e2
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          source /ws/install/setup.bash
          exec ros2 run operational_event_dispatcher operational_event_dispatcher \
            --ros-args \
            -p server_timeout_sec:=5.0 \
            -p goal_timeout_sec:=45.0
        env:
        - name: ROS_DOMAIN_ID
          value: "229"
        - name: RMW_IMPLEMENTATION
          value: rmw_fastrtps_cpp
        - name: FASTRTPS_DEFAULT_PROFILES_FILE
          value: /etc/fastdds/fastdds.xml
        - name: FASTDDS_DEFAULT_PROFILES_FILE
          value: /etc/fastdds/fastdds.xml
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          exec:
            command: ["/bin/bash", "-c", "kill -0 1"]
          periodSeconds: 5
        livenessProbe:
          exec:
            command: ["/bin/bash", "-c", "kill -0 1"]
          periodSeconds: 10
        volumeMounts:
        - name: fastdds
          mountPath: /etc/fastdds
          readOnly: true
      volumes:
      - name: fastdds
        configMap:
          name: e2-fastdds-udp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: e2-event-detector-config
  namespace: cloud-native-e2
data:
  e2_telemetry.yaml: |
    event_detector:
      ros__parameters:
        startup_state: 3
        buffer:
          default_time: 10.0
          default_queue_size: 20
          use_msg_stamp: true
        analysis:
          default_period: 0.2
        rules:
          - px4_event_detector_plugin::TelemetryHeartbeatRule
        rule_params:
          px4_event_detector_plugin::TelemetryHeartbeatRule:
            enabled: true
            period: 0.2
            parameters:
              robot_id: drone01
              vehicle_status_topic: /fmu/out/vehicle_status_v4
              event_topic: /fleet/operational_events
              startup_grace_sec: 2.0
              timeout_sec: 3.0
              recovery_samples: 3
              recovery_window_sec: 2.0
              recovery_stability_sec: 3.0
              cooldown_sec: 5.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-event-detector-e2
  namespace: cloud-native-e2
  labels:
    app.kubernetes.io/name: telemetry-event-detector-e2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-event-detector-e2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-event-detector-e2
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      containers:
      - name: event-detector
        image: cloud-native-ros/event-detector:e2-upstream
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-lc"]
        args:
        - |
          source /ws/install/setup.bash
          exec ros2 launch event_detector event_detector.launch.py \
            params:=/etc/event-detector/e2_telemetry.yaml \
            log_level:=warn
        env:
        - name: ROS_DOMAIN_ID
          value: "229"
        - name: RMW_IMPLEMENTATION
          value: rmw_fastrtps_cpp
        - name: FASTRTPS_DEFAULT_PROFILES_FILE
          value: /etc/fastdds/fastdds.xml
        - name: FASTDDS_DEFAULT_PROFILES_FILE
          value: /etc/fastdds/fastdds.xml
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 1Gi
        startupProbe:
          exec:
            command:
            - /bin/bash
            - -lc
            - |
              source /ws/install/setup.bash
              raw=$(ROS2CLI_DISABLE_DAEMON=1 ros2 lifecycle get /event_detector 2>/dev/null) || exit 1
              [ -n "$raw" ] || exit 1
              [ "${raw%% *}" = "active" ]
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 12
        readinessProbe:
          exec:
            command:
            - /bin/bash
            - -lc
            - |
              source /ws/install/setup.bash
              raw=$(ROS2CLI_DISABLE_DAEMON=1 ros2 lifecycle get /event_detector 2>/dev/null) || exit 1
              [ -n "$raw" ] || exit 1
              [ "${raw%% *}" = "active" ]
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: ["/bin/bash", "-c", "kill -0 1"]
          periodSeconds: 10
        volumeMounts:
        - name: detector-config
          mountPath: /etc/event-detector
          readOnly: true
        - name: fastdds
          mountPath: /etc/fastdds
          readOnly: true
      volumes:
      - name: detector-config
        configMap:
          name: e2-event-detector-config
      - name: fastdds
        configMap:
          name: e2-fastdds-udp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone01-microxrce-agent
  namespace: cloud-native-e2
  labels:
    app.kubernetes.io/name: drone01-microxrce-agent
    app.kubernetes.io/managed-by: kuberos-e2
    cloud-native-robotics.io/robot-id: drone01
spec:
  replicas: 1
  strategy:
    # hostNetwork exposes the fixed UDP port 8888. Recreate prevents the old
    # and new Micro XRCE-DDS Agent pods from binding it at the same time.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: drone01-microxrce-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drone01-microxrce-agent
        app.kubernetes.io/managed-by: kuberos-e2
        cloud-native-robotics.io/robot-id: drone01
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 5
      containers:
      - name: microxrce-agent
        image: microros/micro-ros-agent:humble
        imagePullPolicy: IfNotPresent
        args: ["udp4", "--port", "8888"]
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        readinessProbe:
          exec:
            command: ["/bin/bash", "-c", "kill -0 1"]
          periodSeconds: 3
        livenessProbe:
          exec:
            command: ["/bin/bash", "-c", "kill -0 1"]
          periodSeconds: 10
