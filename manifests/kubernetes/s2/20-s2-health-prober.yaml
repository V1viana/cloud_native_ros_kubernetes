# S2 health prober (R11, contract s2-partition-v1): persistent GetHealthSnapshot
# clients for drone01-03 onboard and drone01 edge, each on its own schedule
# (5 s, timeout 3 s), on the edge node -- never on drone01's, whose isolation
# must not suspend the checks of the others. Same manifest in A and B. Evidence
# on a hostPath of its node, read from the host with docker exec.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s2-health-prober
  namespace: cloud-native-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s2-health-prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s2-health-prober
    spec:
      nodeSelector:
        kuberos.io/role: edge
      containers:
        - name: prober
          image: cloud-native-ros/s2-harness:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              source /ws/install/setup.bash
              exec /ws/install/lib/s2_harness/s2_health_prober --ros-args \
                -p out_dir:=/var/lib/s2-prober \
                -p run_id:=__S2_RUN_ID__
          env:
            - name: ROS_DOMAIN_ID
              value: "230"
            - name: RMW_IMPLEMENTATION
              value: rmw_fastrtps_cpp
            - name: ROS_DISCOVERY_SERVER
              value: __P2_DISCOVERY_ADDRESS__:11811
          volumeMounts:
            - name: out
              mountPath: /var/lib/s2-prober
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 2
      volumes:
        - name: out
          hostPath:
            path: /var/lib/s2-prober
            type: DirectoryOrCreate
