# S2 test harness on drone01's node (R11, docs/R11_S2_PARTITION.md): the local
# recorder of the analytics metrics and the transient injector, one process and
# one DDS participant (sources/s2_harness). Same manifest in A and B; the runner
# renders the metrics topic (A /drone01/analytics/metrics, B .../metrics/onboard)
# and the discovery server address.
# Control and evidence go through a hostPath on the node: the runner writes
# arm.json/pulse.json and reads samples.jsonl/events.jsonl from the host with
# `docker exec` on the node container -- a channel the partition does not cut.
# Commands carry the run id rendered here (__S2_RUN_ID__); others are ignored.
# The executable is started directly, not through `ros2 run`, so SIGTERM reaches
# it and a pulse still high is restored before exit (verified offline: `ros2 run`
# does not forward SIGTERM to its child). The grace period outlives the restore
# deadline (60 s).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone01-s2-harness
  namespace: cloud-native-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: drone01-s2-harness
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drone01-s2-harness
    spec:
      nodeSelector:
        robot.kuberos.io/id: drone01
      terminationGracePeriodSeconds: 75
      containers:
        - name: harness
          image: cloud-native-ros/s2-harness:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              source /ws/install/setup.bash
              exec /ws/install/lib/s2_harness/s2_harness --ros-args \
                -p metrics_topic:=__S2_METRICS_TOPIC__ \
                -p control_dir:=/var/lib/s2-harness \
                -p run_id:=__S2_RUN_ID__
          env:
            - name: ROS_DOMAIN_ID
              value: "230"
            - name: RMW_IMPLEMENTATION
              value: rmw_fastrtps_cpp
            - name: ROS_DISCOVERY_SERVER
              value: __P2_DISCOVERY_ADDRESS__:11811
          volumeMounts:
            - name: control
              mountPath: /var/lib/s2-harness
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 2
      volumes:
        - name: control
          hostPath:
            path: /var/lib/s2-harness
            type: DirectoryOrCreate
