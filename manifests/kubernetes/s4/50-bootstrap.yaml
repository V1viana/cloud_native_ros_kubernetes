# S4 variant A's own KubeROS submission Job -- identical mechanism to
# manifests/kubernetes/e0/30-bootstrap.yaml (same e0_kuberos_bootstrap
# binary, unmodified: it just submits every manifest file under its mount
# to the KubeROS API and waits for each to report ready), pointed at S4's
# own rendered manifests (scripts/render_s4_manifests.py) instead of E0's.
# Named distinctly so both scenarios' evidence stays unambiguous even
# though they never actually run concurrently on this shared cluster.
apiVersion: batch/v1
kind: Job
metadata:
  name: s4-kuberos-bootstrap
  namespace: cloud-native-p2
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s4-kuberos-bootstrap
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kuberos.io/role: control_plane
      containers:
        - name: bootstrap
          image: cloud-native-ros/control-plane:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |-
              source /ws/install/setup.bash
              exec ros2 run e0_kuberos_bootstrap e0_kuberos_bootstrap --manifest-dir /etc/s4/manifests --kuberos-url http://kuberos-api:8000 --timeout-sec 240
          env:
            - name: KUBEROS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuberos-api-token
                  key: token
          volumeMounts:
            - name: manifests
              mountPath: /etc/s4/manifests
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
      volumes:
        - name: manifests
          configMap:
            name: s4-kuberos-manifests
