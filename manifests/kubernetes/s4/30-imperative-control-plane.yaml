# S4 variant A's own Application Manager + Dispatcher pair, dedicated
# (application-manager-s4 / operational-event-dispatcher-s4) rather than
# reusing application-manager-p2 / operational-event-dispatcher-p2
# (manifests/kubernetes/p2/30-control-plane.yaml, unmodified): that shared
# pair is wired only for P0 (audit-only) and P2 (KubeROS edge migration via
# manifests/kuberos/p2/analytics-edge.yaml) -- P1 (restore_telemetry) is
# left as an UnavailableHandler there on purpose, since none of
# E0/E1/E4/P2 ever exercises it. S4 needs all three concurrently, with P2
# pointed at drone03's own deliberately-broken edge manifest instead of
# P2's successful one, so it gets its own control plane pair instead of
# widening the shared one -- same reasoning, and the same dedicated-pair
# pattern, as manifests/kubernetes/e2/stack.yaml's own application-manager-e2.
#
# Runs alongside E0's own KubeROS/kuberos-api (already bootstrapped by the
# time this is applied) on the same cloud-native-p2 cluster: only one
# Application Manager / Dispatcher pair is ever active at a time in this
# namespace (S4, like every other scenario here, resets the whole cluster
# per run), so both keep the defaults for action_name/event_topic without
# any risk of colliding with application-manager-p2.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: application-manager-s4
  namespace: cloud-native-p2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: application-manager-s4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: application-manager-s4
    spec:
      serviceAccountName: application-manager-s4
      nodeSelector:
        kuberos.io/role: control_plane
      containers:
        - name: manager
          image: cloud-native-ros/control-plane:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              source /ws/install/setup.bash
              exec ros2 run cloud_native_application_manager application_manager --ros-args \
                -p kuberos_base_url:=http://kuberos-api:8000 \
                -p analytics_manifest_path:=/etc/s4/analytics-edge-drone03.yaml \
                -p analytics_rollback_timeout_sec:=30.0 \
                -p kubernetes_namespace:=cloud-native-p2 \
                -p diagnostic_job_template_path:=/etc/s4-diagnostics/job.yaml \
                -p default_timeout_sec:=60.0 \
                -p poll_interval_sec:=0.5 \
                -p audit_url:=http://p2-audit-writer:8080/records \
                -p notifier_url:=http://p2-operator-notifier:8081/notifications
          env:
            - name: KUBEROS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuberos-api-token
                  key: token
            - name: ROS_DOMAIN_ID
              value: "230"
            - name: RMW_IMPLEMENTATION
              value: rmw_fastrtps_cpp
            - name: ROS_DISCOVERY_SERVER
              value: __P2_DISCOVERY_ADDRESS__:11811
          volumeMounts:
            - name: analytics-manifest
              mountPath: /etc/s4
              readOnly: true
            - name: diagnostic-job-template
              mountPath: /etc/s4-diagnostics
              readOnly: true
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 10
      volumes:
        - name: analytics-manifest
          configMap:
            name: s4-analytics-edge-drone03-manifest
        - name: diagnostic-job-template
          configMap:
            name: s4-diagnostic-job-template
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operational-event-dispatcher-s4
  namespace: cloud-native-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operational-event-dispatcher-s4
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operational-event-dispatcher-s4
    spec:
      nodeSelector:
        kuberos.io/role: control_plane
      containers:
        - name: dispatcher
          image: cloud-native-ros/control-plane:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              source /ws/install/setup.bash
              exec ros2 run operational_event_dispatcher operational_event_dispatcher --ros-args \
                -p server_timeout_sec:=10.0 \
                -p goal_timeout_sec:=60.0
          env:
            - name: ROS_DOMAIN_ID
              value: "230"
            - name: RMW_IMPLEMENTATION
              value: rmw_fastrtps_cpp
            - name: ROS_DISCOVERY_SERVER
              value: __P2_DISCOVERY_ADDRESS__:11811
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 3
          livenessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 10
