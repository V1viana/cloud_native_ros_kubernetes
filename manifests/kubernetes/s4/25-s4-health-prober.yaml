# S4 health prober (R13, docs/R13_S4_EDGE_PILOT_PROTOCOL.md): the S2 prober's image
# and code, a ROS 2 process on the CONTROL-PLANE node -- never on the edge node,
# whose stop is the fault. One persistent GetHealthSnapshot client per target:
# drone01-04 onboard and drone03 edge, queried apart (identity, healthy, lifecycle
# 'active'); every call has a deadline (0.9 s, period 1 s), a call past it is
# recorded as rpc_timeout, not as a negative answer. Same manifest in A and B.
# Evidence on a hostPath of its node, read from the host with docker exec.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s4-health-prober
  namespace: cloud-native-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s4-health-prober
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s4-health-prober
    spec:
      nodeSelector:
        kuberos.io/role: control_plane
      containers:
        - name: prober
          image: cloud-native-ros/s2-harness:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              source /ws/install/setup.bash
              exec /ws/install/lib/s2_harness/s2_health_prober --ros-args \
                -p out_dir:=/var/lib/s4-prober \
                -p run_id:=__S4_RUN_ID__ \
                -p period_sec:=1.0 \
                -p timeout_sec:=0.9 \
                -p "robots:=[drone01, drone02, drone03, drone04]" \
                -p "edge_robots:=[drone03]"
          env:
            - name: ROS_DOMAIN_ID
              value: "230"
            - name: RMW_IMPLEMENTATION
              value: rmw_fastrtps_cpp
            - name: ROS_DISCOVERY_SERVER
              value: __P2_DISCOVERY_ADDRESS__:11811
          volumeMounts:
            - name: out
              mountPath: /var/lib/s4-prober
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 2
      volumes:
        - name: out
          hostPath:
            path: /var/lib/s4-prober
            type: DirectoryOrCreate
