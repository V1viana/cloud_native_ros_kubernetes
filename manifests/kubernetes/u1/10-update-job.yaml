apiVersion: batch/v1
kind: Job
metadata:
  name: u1-kuberos-update
  namespace: cloud-native-p2
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: u1-kuberos-update
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kuberos.io/role: control_plane
      containers:
        - name: update
          image: cloud-native-ros/control-plane:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |-
              source /ws/install/setup.bash
              exec ros2 run e0_kuberos_bootstrap e0_kuberos_update --manifest /etc/u1/revision-2.yaml --kuberos-url http://kuberos-api:8000 --timeout-sec 240
          env:
            - name: KUBEROS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuberos-api-token
                  key: token
          volumeMounts:
            - name: manifest
              mountPath: /etc/u1
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
      volumes:
        - name: manifest
          configMap:
            name: u1-kuberos-update-manifest
