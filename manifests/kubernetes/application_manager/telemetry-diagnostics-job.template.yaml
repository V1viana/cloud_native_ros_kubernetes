apiVersion: batch/v1
kind: Job
metadata:
  generateName: telemetry-diag-
  labels:
    app.kubernetes.io/name: telemetry-diagnostics
    app.kubernetes.io/managed-by: cloud-native-application-manager
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 310
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-diagnostics
    spec:
      serviceAccountName: cloud-native-application-manager
      restartPolicy: Never
      containers:
      - name: collector
        image: ros:humble-ros-base
        imagePullPolicy: IfNotPresent
        command: ["/bin/bash", "-ec"]
        args:
        - |
          python3 - <<'PY'
          import json
          import os
          import ssl
          import time
          from urllib.request import Request, urlopen

          namespace = os.environ["POD_NAMESPACE"]
          host = os.environ["KUBERNETES_SERVICE_HOST"]
          port = os.environ.get("KUBERNETES_SERVICE_PORT_HTTPS", "443")
          account = "/var/run/secrets/kubernetes.io/serviceaccount"
          with open(f"{account}/token", encoding="utf-8") as stream:
              token = stream.read().strip()
          context = ssl.create_default_context(cafile=f"{account}/ca.crt")
          base = f"https://{host}:{port}"

          def get(path):
              request = Request(
                  base + path,
                  headers={"Authorization": f"Bearer {token}"},
              )
              with urlopen(request, context=context, timeout=5) as response:
                  return json.load(response)

          end = time.monotonic() + 300
          while time.monotonic() < end:
              pods = get(f"/api/v1/namespaces/{namespace}/pods")
              events = get(
                  f"/apis/events.k8s.io/v1/namespaces/{namespace}/events"
              )
              record = {
                  "timestamp": time.time(),
                  "robot_id": os.environ.get("ROBOT_ID", ""),
                  "correlation_id": os.environ.get(
                      "INCIDENT_CORRELATION_ID", ""
                  ),
                  "pods": [
                      {
                          "name": item["metadata"]["name"],
                          "phase": item.get("status", {}).get("phase", ""),
                      }
                      for item in pods.get("items", [])
                  ],
                  "events": [
                      {
                          "reason": item.get("reason", ""),
                          "action": item.get("action", ""),
                          "note": item.get("note", ""),
                      }
                      for item in events.get("items", [])[-50:]
                  ],
              }
              print(json.dumps(record, sort_keys=True), flush=True)
              time.sleep(10)
          PY
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
