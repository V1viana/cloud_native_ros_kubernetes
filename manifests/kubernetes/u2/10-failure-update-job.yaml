apiVersion: batch/v1
kind: Job
metadata:
  name: u2-kuberos-failure-update
  namespace: cloud-native-p2
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 360
  template:
    metadata:
      labels:
        app.kubernetes.io/name: u2-kuberos-failure-update
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      nodeSelector:
        kuberos.io/role: control_plane
      containers:
        - name: update
          image: cloud-native-ros/control-plane:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |-
              source /ws/install/setup.bash
              exec ros2 run e0_kuberos_bootstrap e0_kuberos_update --manifest /etc/u2/revision-failure.yaml --kuberos-url http://kuberos-api:8000 --timeout-sec 300 --expect-failure
          env:
            - name: KUBEROS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kuberos-api-token
                  key: token
          volumeMounts:
            - name: manifest
              mountPath: /etc/u2
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
      volumes:
        - name: manifest
          configMap:
            name: u2-kuberos-failure-manifest
