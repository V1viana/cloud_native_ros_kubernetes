# Mission continuity observer (checklist R8, SPECIFICA s21): passive, publishes
# and commands nothing; same manifest in variants A and B. Own image, so the
# compared control-plane image is not touched by it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone01-mission-observer
  namespace: cloud-native-p2
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: drone01-mission-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: drone01-mission-observer
    spec:
      nodeSelector:
        kuberos.io/role: onboard
      containers:
        - name: observer
          image: cloud-native-ros/mission-observer:p2
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              source /ws/install/setup.bash
              exec ros2 run mission_observer mission_observer --ros-args \
                -p vehicle_status_topic:=/fmu/out/vehicle_status_v4 \
                -p gap_report_sec:=2.0 \
                -p summary_period_sec:=5.0
          env:
            - name: ROS_DOMAIN_ID
              value: "230"
            - name: RMW_IMPLEMENTATION
              value: rmw_fastrtps_cpp
            - name: ROS_DISCOVERY_SERVER
              value: __P2_DISCOVERY_ADDRESS__:11811
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          readinessProbe:
            exec:
              command: ["/bin/bash", "-c", "kill -0 1"]
            periodSeconds: 2
